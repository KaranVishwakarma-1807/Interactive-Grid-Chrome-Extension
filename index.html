<!DOCTYPE html>
<html>
<head>
  <title>New Tab</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/tab-icon" href="assets/favicon.png">
</head>
<body>

  <div id="clock"></div>

  <form id="searchForm">
    <input type="text" id="searchInput" placeholder="Search Google...">
  </form>

  <div id="themeBtn" title="Themes">
    <img src="assets/theme_logo.svg" alt="Themes" width="24" height="24">
  </div>

  <div id="themePanel">
    <h3>Themes</h3>
    <div id="themeList"></div>
    <button id="applyThemeBtn">Apply</button>
  </div>

  <div id="settingsBtn">
    <img src="assets/gear_logo.svg" alt="Settings" width="24" height="24">
  </div>

  <div id="settingsPanel">
    <h3>Settings</h3>

    <label>Grid Spacing</label>
    <input type="range" id="spacing" min="10" max="50">

    <label>Speed</label>
    <input type="range" id="speed" min="0.05" max="0.3" step="0.01">

    <button id="resetBtn">Reset</button>
    <button id="saveSettingsBtn">Save</button>
    <h4>By Karan Vishwakarma</h4>
  </div>

  <button id="fullscreenBtn" type="button" title="Toggle fullscreen" aria-label="Toggle fullscreen">
    <img src="assets/fullscreen_logo.svg" alt="" width="24" height="24">
  </button>

  <button id="aboutMeBtn" type="button" title="" aria-label="Open portfolio website">
    <img src="assets/aboutme_logo.svg" alt="" width="24" height="24">
    <span> About Me</span>
  </button>

  <script src="p5.min.js"></script>
  <script src="themes/themeRegistry.js"></script>
  <script src="themes/interactiveGrid.js"></script>
  <script src="themes/bouncingBall.js"></script>
  <script src="themes/movingDial.js"></script>
  <script src="themes/rotatingBlocks.js"></script>
  <script src="themes/rotatingPacman.js"></script>
  <script src="themes/tenticle.js"></script>
  <script src="sketch.js"></script>
  <script src="ui.js"></script>
</body>
</html>
